name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn -B test)
        run: mvn -B test

# A second job running the analysis pipeline (aerf-pipeline's Main) against
# a real cloned repository was part of the ExtractionAdapter Plan's
# Increment 16 scope, but is deliberately NOT added here yet: it is gated
# on an iterative rewrite of StronglyConnectedComponents (open question #7
# in docs/open-questions-register.md) - the current recursive Tarjan
# implementation will stack-overflow on a sufficiently deep dependency
# chain, which a small synthetic sample never exercises but a real
# repository of nontrivial size plausibly would. Adding this job before
# that gate is closed would risk a flaky, hard-to-diagnose CI failure
# rather than a real signal. See docs/increment-16-*.md.
