name: CI

on:
  push:
    # This repo has no "main" - claude/aerf-core-domain-model-gwumun is
    # its only branch and its default. Naming it explicitly, rather than
    # "main", is why: a hardcoded "main" here would silently never match
    # any push at all, exactly what happened from Increment 16 (when
    # this workflow was added) through Increment 19 - confirmed via
    # `list_workflow_runs` returning zero runs, ever, before this fix.
    branches: [claude/aerf-core-domain-model-gwumun]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn -B test)
        run: mvn -B test

# A second job running the analysis pipeline (aerf-pipeline's Main) against
# a real cloned repository was part of the ExtractionAdapter Plan's
# Increment 16 scope, but was deliberately NOT added there: it was gated
# on an iterative rewrite of StronglyConnectedComponents, since the
# recursive Tarjan implementation then in use would stack-overflow on a
# sufficiently deep dependency chain - a risk a small synthetic sample
# never exercises but a real repository of nontrivial size plausibly
# would. That rewrite is done (Increment 17, docs/increment-17-*.md;
# formerly open question #7, now resolved), so the gate itself is closed.
# This job is still not added here, though: doing so is its own increment
# (choosing a target repository, classpath discovery, what a meaningful
# pass/fail signal even means for exploratory analysis output) that
# nobody has asked for yet, not a continuation of removing this gate.
