name: Deploy dashboard to GitHub Pages

on:
  push:
    # This repo has no "main" - claude/aerf-core-domain-model-gwumun is
    # its only branch and its default (same fix, same reason, as ci.yml).
    branches: [claude/aerf-core-domain-model-gwumun]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# One-time setup this workflow can't do itself: enable Pages on this repo
# at Settings -> Pages -> Source: GitHub Actions. Once that's on, this
# publishes dashboard/ verbatim (no build step - it's already plain
# HTML/CSS/JS with a vendored dependency, see dashboard/vendor/README.md)
# to https://costinfl.github.io/aerf/, which the account's existing
# costinfl.dev custom-domain redirect already extends to
# https://www.costinfl.dev/aerf/ with no further DNS/CNAME work here.
